services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - OLLAMA_KEEP_ALIVE=24h 
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama     # downloaded models persist across restarts
    # NVIDIA GPU (needs an NVIDIA driver on the host). Remove this block to run on CPU only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - ./n8n_data:/home/node/.n8n
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Africa/Tunis}
      - TZ=${GENERIC_TIMEZONE:-Africa/Tunis}
    depends_on:
      - qdrant
      - ollama
# Inside n8n, reach services by name: Qdrant http://qdrant:6333, Ollama http://ollama:11434 (not localhost).