services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:?set QDRANT_VERSION in .env}
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:?set OLLAMA_VERSION in .env}
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama     # downloaded models persist across restarts
    environment:
      - OLLAMA_KEEP_ALIVE=24h           # keep bge-m3 loaded: avoids a ~25 s cold start on the first query
    # NVIDIA GPU (needs an NVIDIA driver on the host). Remove this block to run on CPU only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  reranker:                             # cross-encoder reranking (Hugging Face Text Embeddings Inference)
    image: ghcr.io/huggingface/text-embeddings-inference:${RERANKER_VERSION:?set RERANKER_VERSION in .env}
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-reranker-v2-m3"]
    ports:
      - "8081:80"
    volumes:
      - ./tei_data:/data                # downloaded model persists across restarts
    # NVIDIA GPU. For CPU only: remove this block and use RERANKER_VERSION=cpu-1.9
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  rag-api:                              # KB retrieval API used by the n8n RAG Agent
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - OLLAMA_URL=http://ollama:11434
      - RERANKER_URL=http://reranker:80
    depends_on:
      - qdrant
      - ollama
      - reranker

  n8n:
    image: n8nio/n8n:${N8N_VERSION:?set N8N_VERSION in .env}
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - ./n8n_data:/home/node/.n8n
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Africa/Tunis}
      - TZ=${GENERIC_TIMEZONE:-Africa/Tunis}
    depends_on:
      - qdrant
      - ollama
      - rag-api
# Inside n8n, reach services by name: rag-api http://rag-api:8000, Qdrant http://qdrant:6333, Ollama http://ollama:11434.
