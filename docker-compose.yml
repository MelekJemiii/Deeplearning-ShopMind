services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - ./n8n_data:/home/node/.n8n
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Africa/Tunis}
      - TZ=${GENERIC_TIMEZONE:-Africa/Tunis}
    depends_on:
      - qdrant
# Inside n8n, reach Qdrant at http://qdrant:6333 (service name), not localhost.
