# ShopMind AI - RAG retrieval test set (v1)
# Written BEFORE chunking to keep the evaluation unbiased. Do not tune it on results.
#
# A retrieved chunk is RELEVANT if it comes from one of the `relevant` doc_ids
# AND contains at least one of that doc's `evidence` phrases (case/format-insensitive).
# This is chunking-independent: the same labels work for every chunking strategy.
#
# type: use_case | definition | spec_lookup | compatibility | cross_lingual | out_of_scope
# out_of_scope queries have no relevant docs: the system should return low-similarity results.
# Validate labels with:  python scripts/04_validate_testset.py

queries:
  # ---------- Use-case advice (French, answered by team guides) ----------
  - id: q01
    query: "Combien de RAM faut-il pour faire de la data science ?"
    lang: fr
    type: use_case
    relevant:
      - {doc_id: guide_001, evidence: ["16 Go : minimum recommandé"]}

  - id: q02
