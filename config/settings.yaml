# Single source of truth for all pipeline parameters.
paths:
  guides_dir: content/guides
  markdown_dir: data/markdown
  raw_pdf_dir: data/raw/pdf
  processed_dir: data/processed
  metadata_csv: data/kb_metadata.csv
  eval_dir: eval

collection:
  wikipedia:
    pause_between_s: 2.0
    max_retries: 5
    drop_sections:
      - references
      - see also
      - external links
      - notes
      - further reading
      - bibliography
      - sources
      - citations
      - notes et références
      - références
      - voir aussi
      - liens externes
      - bibliographie
      - articles connexes

cleaning:
  # A short line repeated this many times in ONE PDF is a page header/footer.
  # Digits are masked before counting, so "2 of 8" and "3 of 8" count as the same line.
  repeated_line_min_count: 3
  repeated_line_max_chars: 120
  min_doc_words: 50            # warn if a cleaned document is shorter than this
  # Lines matching any of these (case-insensitive regex) are dropped: legal / non-product text.
  boilerplate_patterns:
    - 'provides this publication "?as is'
    - 'reserves the right to change'
    - 'not responsible for (photographic|typographic)'
    - 'trademarks? (or registered trademarks? )?of'
    - 'all rights reserved'
    - 'may not be available in all regions'
    - 'not all configuration components are available'
    - 'feature with \*+ means'
    - 'product image may differ'
    - 'is subject to change without notice'

# Filled in the next steps
chunking:
  # cl100k_base = tokenizer of OpenAI text-embedding-3-* models; token counts = embedding cost + limits
  tokenizer: cl100k_base
  output_dir: data/chunks
  strategies:
    # Same max size for A and B: the comparison then isolates ONE variable, structure awareness.
    A:
      method: recursive        # structure-blind: pack paragraphs, split sentences/words when too long
      max_tokens: 500
      overlap_tokens: 50       # ~10%: keeps ideas cut at a boundary readable in the next chunk
    B:
      method: headings         # one chunk per section, prefixed with its heading path
      max_tokens: 500
      min_tokens: 80           # smaller sections are merged with the following ones
      overlap_tokens: 0        # sections are self-contained; only oversized ones are sub-split
embedding:
  provider: ollama                 # ollama | gemini | fake  (env EMBEDDING_PROVIDER overrides)
  cache_dir: data/embeddings       # vectors cached by hash(provider, model, dims, input): reruns cost nothing
  max_retries: 6
  providers:
    ollama:                        # local, free, unlimited; runs in Docker next to Qdrant
      model: bge-m3                # multilingual (FR+EN in one space), 1024 dims, 8192-token context
      dimensions: 1024
      document_format: "{title}\n\n{text}"   # bge-m3 dense retrieval needs no task instruction
      query_format: "{query}"
      batch_size: 16
      timeout_s: 300
    gemini:                        # API; free tier: 100 RPM, 30k TPM, 1,000 requests/day
      model: gemini-embedding-2
      dimensions: 768
      # gemini-embedding-2 has no task_type parameter: the task is written into the text
      document_format: "title: {title} | text: {text}"
      query_format: "task: question answering | query: {query}"
      batch_size: 20
      rate_limit:                  # client-side throttling below the free-tier quota
        requests_per_minute: 90
        tokens_per_minute: 27000
    fake:                          # deterministic vectors, for tests without any service
      model: hashing
      dimensions: 256
      document_format: "{title}\n\n{text}"
      query_format: "{query}"
      batch_size: 64

vector_store:
  collection_prefix: shopmind_kb   # one collection per (embedding provider, strategy): shopmind_kb_ollama_A ...
  distance: cosine
  payload_indexes: [doc_id, source_type, device_category, language, topic]   # fields usable as filters
  upsert_batch_size: 128

retrieval:                       # used by the retrieval API (what the n8n RAG Agent calls)
  provider: ollama                 # must match the provider used to index the collection
  strategy: B                      # selected by evaluation: MRR 0.88 vs 0.81 (eval/results/summary.md)
  mode: dense                      # dense | hybrid  (switch only if the evaluation says hybrid is better)
  rerank: true                     # evaluation: dense+rerank Hit@1 24/28, MRR 0.923 (vs dense 23/28, 0.882)
  min_rerank_score: 0.05           # when rerank is on, this floor replaces min_score (cosine is no longer the ranking signal)
  top_k: 5
  max_top_k: 10
  min_score: 0.45                  # below this a chunk is dropped (evaluation: unrelated queries ~0.32)
  filterable_fields: [device_category, source_type, language, doc_id, topic]

hybrid:                            # dense (bge-m3) + sparse (BM25), fused with Reciprocal Rank Fusion
  k1: 1.2                          # BM25 term-frequency saturation
  b: 0.75                          # BM25 document-length normalization
  prefetch_k: 20                   # candidates taken from EACH side before fusion

rerank:                            # cross-encoder second stage (TEI service "reranker")
  provider: tei                    # tei | fake  (env RERANK_PROVIDER overrides)
  model: BAAI/bge-reranker-v2-m3   # multilingual (FR+EN) cross-encoder, same family as bge-m3
  candidates: 20                   # first-stage results passed to the reranker
  batch_size: 32                   # TEI default max client batch
  timeout_s: 60

evaluation:
  k_values: [1, 3, 5, 10]        # Hit@k reported for each; MRR computed over the top max(k)
  results_dir: eval/results
